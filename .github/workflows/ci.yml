name: CI

# External actions are pinned to full commit SHAs to prevent supply-chain
# attacks via tag reassignment. Run `gh api repos/OWNER/REPO/git/refs/tags/vN`
# to look up the current SHA when upgrading.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # `main` is the only ref carrying all three halves this plugin needs —
  # `Spora\Skills\SkillProviderInterface`, `SkillCatalogPresenter` and
  # `Spora\Search\SearchProviderInterface` are in no tag and on no other branch.
  # composer.json therefore still resolves spora-core through a `path` repository
  # with a pinned version; the repository entry and this var both go when core
  # tags the release carrying the seam.
  #
  # Tracking main means CI goes red when core drops `$userId` from
  # `ToolInterface::execute()`, because the plugin declares the four-parameter
  # signature only. That red is the signal for the phase-2a change, not a reason
  # to pin a ref.
  #
  # `path:` is workspace-relative, so the core checkout lands inside this
  # workspace while composer.json declares `../spora-core`, a sibling — hence the
  # symlink every job runs before `composer install`.
  SPORA_CORE_REF: main

jobs:
  test:
    name: Pest (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (path repository)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: ${{ env.SPORA_CORE_REF }}
          path: spora-core

      - name: Link spora-core to the sibling path the lock expects
        run: ln -sfn "$GITHUB_WORKSPACE/spora-core" "$GITHUB_WORKSPACE/../spora-core"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Run Pest
        run: ./vendor/bin/pest --parallel --processes=auto --max-batch-size=50

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (path repository)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: ${{ env.SPORA_CORE_REF }}
          path: spora-core

      - name: Link spora-core to the sibling path the lock expects
        run: ln -sfn "$GITHUB_WORKSPACE/spora-core" "$GITHUB_WORKSPACE/../spora-core"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=512M

  code-style:
    name: php-cs-fixer (dry-run)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (path repository)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: ${{ env.SPORA_CORE_REF }}
          path: spora-core

      - name: Link spora-core to the sibling path the lock expects
        run: ln -sfn "$GITHUB_WORKSPACE/spora-core" "$GITHUB_WORKSPACE/../spora-core"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Check code style
        # Same ruleset as spora-core's .php-cs-fixer.php so plugin style matches host.
        run: ./vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction

  coverage:
    name: Coverage (clover)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Checkout spora-core (path repository)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: spora-ai/spora-core
          ref: ${{ env.SPORA_CORE_REF }}
          path: spora-core

      - name: Link spora-core to the sibling path the lock expects
        run: ln -sfn "$GITHUB_WORKSPACE/spora-core" "$GITHUB_WORKSPACE/../spora-core"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: curl, mbstring
          coverage: xdebug
          tools: composer

      - name: Composer install
        run: composer install --no-interaction --prefer-dist

      - name: Run Pest with coverage
        run: XDEBUG_MODE=coverage ./vendor/bin/pest --coverage-clover=coverage.xml --coverage-filter=src --parallel --processes=auto --max-batch-size=50

      - name: Upload coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-clover
          path: coverage.xml
          if-no-files-found: error

  sonar:
    name: SonarQube
    needs: [coverage]
    # `always()` so a failed coverage job still feeds SonarCloud a baseline. Fork PRs
    # are skipped: no secrets there.
    if: |
      always() && (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Download coverage
        # Absent when the coverage job failed; the scan still runs, without data.
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: coverage-clover
          path: .

      - name: SonarQube scan
        # Same pin as spora-plugin-memories / spora-frontend, green run there.
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=spora-ai
            -Dsonar.projectKey=spora-ai_spora-plugin-custom-skills
